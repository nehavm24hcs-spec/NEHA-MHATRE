<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Account | LIBRIX</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">


</head>

<body class="auth-page">


<div class="auth-container">

    <!-- ================= LEFT SIDE ================= -->

    <div class="auth-info">

        <div class="auth-logo">
            <span>◈</span> LIBRIX
        </div>

        <div class="auth-content">

            <span class="auth-label">
                JOIN THE LIBRARY
            </span>

            <h1>
                Start Your<br>
                <span>Journey.</span>
            </h1>

            <p>
                Create your account and explore thousands
                of books through our smart digital library.
            </p>

        </div>

        <div class="auth-footer">
            © 2026 LIBRIX Digital Library
        </div>

    </div>


    <!-- ================= RIGHT SIDE ================= -->

    <div class="auth-form-section">

        <div class="auth-form">

            <!-- MOBILE LOGO -->

            <div class="mobile-logo">
                ◈ LIBRIX
            </div>


            <h2>
                Create account
            </h2>

            <p class="form-subtitle">
                Register to access the digital library.
            </p>


            <!-- ================= REGISTER FORM ================= -->

            <form method="POST"
                  action="{{ url_for('register') }}">

                <!-- NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="auth-button">

                    Create Account →

                </button>

            </form>


            <!-- DIVIDER -->

            <div class="divider">

                <span>
                    OR
                </span>

            </div>


            <!-- LOGIN LINK -->

            <p class="register-text">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Sign in
                </a>

            </p>

        </div>

    </div>

</div>

</body>

</html>
